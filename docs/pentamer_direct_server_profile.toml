# 远端计算配置示例，请按实际环境填写。
[identity]
name = "pentamer-direct"
purpose = "五聚体链远端计算配置示例"
maintainer = "USER"

[connection]
repo_path_remote = "/home/USER/code/1x5_Heisenberg_Pentamer"

[connection.ssh]
alias = "server.example.org"
host = "server.example.org"
user = "USER"
identity_file = "~/.ssh/compute_key"
port = 22

[scheduler]
type = "none"
default_partition = "direct"

[[partitions]]
name = "direct"
class = "default-cpu"
cores = 80
memory = "251G"
max_wall = "infinite"
gpu = ""

[filesystem]
home = "/home/USER"
scratch = "/home/USER/code/1x5_Heisenberg_Pentamer/results"
project = "/home/USER/code/1x5_Heisenberg_Pentamer"
quota = "按实际配额填写"

[network]
internet_from_login = false
internet_from_compute = false

[region]
region = "mainland_china"

[limits.hard]
max_walltime = "24:00:00"
max_nodes = 1
max_cpus = 40
max_array_size = 1

[limits.soft]
warn_walltime = "04:00:00"
warn_cpus = 16
unusual_partitions = []

[limits.paths]
allowed_roots = [
  "/home/USER/code/1x5_Heisenberg_Pentamer/results",
  "/home/USER/code/1x5_Heisenberg_Pentamer/data",
]

[commands]
squeue = ""
sacct = ""
sinfo = ""
quota_command = "df -h /home"

[notes]
text = "共享直连服务器，无调度器。默认单重任务、nice=10、JULIA_NUM_THREADS<=16；按断网环境部署，禁止远端 Pkg.add/update。"
